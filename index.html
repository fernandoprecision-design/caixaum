  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword,
      updateProfile,
      sendPasswordResetEmail,
      reauthenticateWithCredential,
      EmailAuthProvider,
      deleteUser,
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      deleteDoc,
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    async function bootstrapFirebase() {
      try {
        const res = await fetch('/api/config', { cache: 'no-store' });
        if (!res.ok) throw new Error('Falha ao carregar /api/config');
        const firebaseConfig = await res.json();
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.FB = { 
          auth, 
          db, 
          signInWithEmailAndPassword, 
          createUserWithEmailAndPassword,
          updateProfile,
          sendPasswordResetEmail,
          reauthenticateWithCredential,
          EmailAuthProvider,
          deleteUser,
          signOut, 
          onAuthStateChanged, 
          doc, 
          setDoc, 
          deleteDoc,
          onSnapshot 
        };
        window.dispatchEvent(new Event('fb-ready'));
      } catch (err) {
        console.error('Erro ao inicializar Firebase:', err);
        window.FB_ERROR = err.message || 'Erro de configuração';
        window.dispatchEvent(new Event('fb-error'));
      }
    }

    bootstrapFirebase();
  </script>

    const hasKw = (text, kw) => kw.length <= 4 ? (' ' + text.replace(/[^a-z0-9]+/g, ' ') + ' ').includes(' ' + kw + ' ') : text.includes(kw);

    function getLocalTodayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addMonthsPreservingDay(dateStr, monthsToAdd) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const targetMonthIndex = (m - 1) + monthsToAdd;
      const targetYear = y + Math.floor(targetMonthIndex / 12);
      const targetMonth = ((targetMonthIndex % 12) + 12) % 12;
      const maxDaysInTarget = new Date(targetYear, targetMonth + 1, 0).getDate();
      const clampedDay = Math.min(d, maxDaysInTarget);
      return `${targetYear}-${String(targetMonth + 1).padStart(2, '0')}-${String(clampedDay).padStart(2, '0')}`;
    }

    function formatDateBR(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function formatMonthBR(ymStr) {
      if (!ymStr || !ymStr.includes('-')) return ymStr;
      const [y, m] = ymStr.split('-');
      return `${m}/${y}`;
    }

    function normalizeText(str) {
      return (str || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim();
    }

    function parseSpokenAmountBR(rawTranscript) {
      const norm = normalizeText(rawTranscript);

      const unitsMap = {
        'zero': 0, 'um': 1, 'uma': 1, 'dois': 2, 'duas': 2, 'tres': 3,
        'quatro': 4, 'cinco': 5, 'seis': 6, 'meia': 6, 'sete': 7, 'oito': 8, 'nove': 9,
        'dez': 10, 'onze': 11, 'doze': 12, 'treze': 13, 'catorze': 14, 'quatorze': 14,
        'quinze': 15, 'dezesseis': 16, 'dezessete': 17, 'dezoito': 18, 'dezenove': 19
      };
      const tensMap = {
        'vinte': 20, 'trinta': 30, 'quarenta': 40, 'cinquenta': 50,
        'sessenta': 60, 'setenta': 70, 'oitenta': 80, 'noventa': 90
      };
      const hundredsMap = {
        'cem': 100, 'cento': 100, 'duzentos': 200, 'duzentas': 200,
        'trezentos': 300, 'trezentas': 300, 'quatrocentos': 400, 'quatrocentas': 400,
        'quinhentos': 500, 'quinhentas': 500, 'seiscentos': 600, 'seiscentas': 600,
        'setecentos': 700, 'setecentas': 700, 'oitocentos': 800, 'oitocentas': 800,
        'novecentos': 900, 'novecentas': 900
      };

      const parseWordChunk = (tokens) => {
        let total = 0;
        let current = 0;
        let hasNumberToken = false;

        for (let i = 0; i < tokens.length; i++) {
          const tok = tokens[i];
          if (/^\d+(?:[.,]\d+)?$/.test(tok)) {
            const numVal = parseFloat(tok.replace(/\.(?=\d{3})/g, '').replace(',', '.'));
            if (!isNaN(numVal)) {
              current += numVal;
              hasNumberToken = true;
            }
          } else if (unitsMap[tok] !== undefined) {
            current += unitsMap[tok];
            hasNumberToken = true;
          } else if (tensMap[tok] !== undefined) {
            current += tensMap[tok];
            hasNumberToken = true;
          } else if (hundredsMap[tok] !== undefined) {
            current += hundredsMap[tok];
            hasNumberToken = true;
          } else if (tok === 'mil') {
            total += (current === 0 ? 1 : current) * 1000;
            current = 0;
            hasNumberToken = true;
          } else if (tok === 'milhao' || tok === 'milhoes') {
            total += (current === 0 ? 1 : current) * 1000000;
            current = 0;
            hasNumberToken = true;
          }
        }
        return hasNumberToken ? total + current : NaN;
      };

      const withoutInstallments = norm.replace(/\b(?:em\s+)?(?:\d+|uma|duas|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze)\s*(?:vezes|x|parcelas?)\b/g, ' ');
      const cleanedForNum = withoutInstallments.replace(/[r$]/g, ' ').replace(/\s+/g, ' ').trim();
      const tokens = cleanedForNum.split(' ');

      const isNumberWord = (w) =>
        /^\d+(?:[.,]\d+)?$/.test(w) ||
        unitsMap[w] !== undefined ||
        tensMap[w] !== undefined ||
        hundredsMap[w] !== undefined ||
        w === 'mil' || w === 'milhao' || w === 'milhoes';

      const reaisIdx = tokens.findIndex(t => t === 'reais' || t === 'real');
      if (reaisIdx > 0) {
        let start = reaisIdx - 1;
        while (start >= 0 && (isNumberWord(tokens[start]) || tokens[start] === 'e' || tokens[start] === 'de')) {
          start--;
        }
        const reaisTokens = tokens.slice(start + 1, reaisIdx).filter(t => t !== 'e' && t !== 'de');
        const mainVal = parseWordChunk(reaisTokens);

        let centsVal = 0;
        const afterReais = tokens.slice(reaisIdx + 1);
        const centIdx = afterReais.findIndex(t => t === 'centavos' || t === 'centavo');
        if (centIdx > 0) {
          const centTokens = afterReais.slice(0, centIdx).filter(t => t !== 'e');
          const parsedCents = parseWordChunk(centTokens);
          if (!isNaN(parsedCents)) centsVal = parsedCents / 100;
        } else if (afterReais.length >= 2 && afterReais[0] === 'e' && isNumberWord(afterReais[1])) {
          const centSlice = [];
          for (let j = 1; j < afterReais.length; j++) {
            if (isNumberWord(afterReais[j])) centSlice.push(afterReais[j]);
            else if (afterReais[j] !== 'e') break;
          }
          const parsedCents = parseWordChunk(centSlice);
          if (!isNaN(parsedCents) && parsedCents < 100) centsVal = parsedCents / 100;
        }

        if (!isNaN(mainVal) && mainVal > 0) {
          return Math.round((mainVal + centsVal) * 100) / 100;
        }
      }

      let bestVal = NaN;
      let i = 0;
      while (i < tokens.length) {
        if (isNumberWord(tokens[i])) {
          const group = [];
          while (i < tokens.length && (isNumberWord(tokens[i]) || tokens[i] === 'e' || tokens[i] === 'de')) {
            if (tokens[i] !== 'e' && tokens[i] !== 'de') group.push(tokens[i]);
            i++;
          }
          const parsed = parseWordChunk(group);
          if (!isNaN(parsed) && parsed > 0) {
            bestVal = parsed;
            break;
          }
        }
        i++;
      }

      return bestVal;
    }

    function detectInstallmentInfo(description) {
      const text = description || '';
      const patterns = [
        /(?:parcela\s*)?(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})(?!\d)/i,
        /\((\d{1,2})\s*\/\s*(\d{1,2})\)/i
      ];
      for (const regex of patterns) {
        const match = text.match(regex);
        if (match) {
          const current = parseInt(match[1], 10);
          const total = parseInt(match[2], 10);
          if (current >= 1 && total >= 2 && current <= total && total <= 48) {
            return { current, total, rawMatch: match[0] };
          }
        }
      }
      return null;
    }

    function getBaseMerchantName(description, rawInstallmentMatch = '') {
      let clean = normalizeText(description);
      if (rawInstallmentMatch) {
        clean = clean.replace(normalizeText(rawInstallmentMatch), ' ');
      }
      clean = clean
        .replace(/\[recorrente\]/g, ' ')
        .replace(/\(?\b\d{1,2}\s*(?:\/|de)\s*\d{1,2}\b\)?/g, ' ')
        .replace(/\bparcela\b/g, ' ')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return clean;
    }

    function detectRecurringSubscription(description, savedRecurringMerchants = []) {
      const norm = normalizeText(description);
      const baseMerchant = getBaseMerchantName(description);
      if (savedRecurringMerchants.some(m => m && baseMerchant.includes(m))) return true;
      return RECURRING_KEYWORDS.some(kw => hasKw(norm, kw));
    }

    function guessCategory(description, customRules = {}, availableCategories = []) {
      const descLower = normalizeText(description);
      const baseMerchant = getBaseMerchantName(description);

      if (baseMerchant && customRules[baseMerchant]) {
        const exists = availableCategories.some(c => c.name === customRules[baseMerchant]);
        if (exists) return customRules[baseMerchant];
      }

      for (const [key, cat] of Object.entries(customRules)) {
        if (key.length >= 3 && descLower.includes(key)) {
          const exists = availableCategories.some(c => c.name === cat);
          if (exists) return cat;
        }
      }

      for (const rule of AUTO_CATEGORIZE_RULES) {
        if (rule.keywords.some(kw => hasKw(descLower, kw))) {
          const exists = availableCategories.some(c => c.name === rule.category);
          if (exists) return rule.category;
        }
      }

      return 'Outros / Serviços';
    }

    function computeDefaultIsPaid(dateStr, recurrenceType, startOffset = 0) {
      const effectiveDate = recurrenceType === 'installment' && startOffset > 0
        ? addMonthsPreservingDay(dateStr, startOffset)
        : dateStr;
      return effectiveDate <= getLocalTodayStr();
    }

    function parseBrazilianNumber(rawVal) {
      if (typeof rawVal === 'number') return rawVal;
      let clean = String(rawVal || '').replace(/[R$\s]/g, '').trim();
      if (!clean) return NaN;
      const isNegative = clean.startsWith('-') || (clean.startsWith('(') && clean.endsWith(')'));
      clean = clean.replace(/[-()]/g, '');
      if (clean.includes(',') && clean.includes('.')) {
        if (clean.lastIndexOf(',') > clean.lastIndexOf('.')) {
          clean = clean.replace(/\./g, '').replace(',', '.');
        } else {
          clean = clean.replace(/,/g, '');
        }
      } else if (clean.includes(',')) {
        clean = clean.replace(',', '.');
      }
      const num = parseFloat(clean);
      if (isNaN(num)) return NaN;
      return isNegative ? -Math.abs(num) : num;
    }

    function normalizeDateString(rawDate, fallbackDate) {
      if (!rawDate) return fallbackDate;
      if (rawDate instanceof Date && !isNaN(rawDate)) {
        return rawDate.toISOString().slice(0, 10);
      }
      if (typeof rawDate === 'number' && rawDate > 20000 && rawDate < 80000) {
        const utcDays = Math.floor(rawDate - 25569);
        const d = new Date(utcDays * 86400 * 1000);
        if (!isNaN(d)) return d.toISOString().slice(0, 10);
      }
      const str = String(rawDate).trim();
      const isoFirst = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      if (isoFirst) return `${isoFirst[1]}-${isoFirst[2].padStart(2, '0')}-${isoFirst[3].padStart(2, '0')}`;
      const brMatch = str.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
      if (brMatch) {
        const d = brMatch[1].padStart(2, '0');
        const m = brMatch[2].padStart(2, '0');
        const y = brMatch[3].length === 2 ? `20${brMatch[3]}` : brMatch[3];
        return `${y}-${m}-${d}`;
      }
      const isoMatch = str.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
      if (isoMatch) {
        return `${isoMatch[1]}-${isoMatch[2].padStart(2, '0')}-${isoMatch[3].padStart(2, '0')}`;
      }
      const ofxMatch = str.match(/^(\d{4})(\d{2})(\d{2})/);
      if (ofxMatch) {
        return `${ofxMatch[1]}-${ofxMatch[2]}-${ofxMatch[3]}`;
      }
      return fallbackDate;
    }

      const [formData, setFormData] = useState(() => {

          installmentStartOffset: 0,
          currentInstallment: 1,
          installments: 2,
          isPaid: true
        };
      });

      const pieChartRef = useRef(null);
      const barChartRef = useRef(null);
      const pieChartInstance = useRef(null);
      const barChartInstance = useRef(null);
      const fixedCardDatesMigratedRef = useRef(false);

      useEffect(() => {
        const onReady = () => setFbReady(true);
        const onErr = () => {
          setFirebaseError(window.FB_ERROR || 'Erro ao carregar credenciais');
          setLoadingAuth(false);
        };
        window.addEventListener('fb-ready', onReady);
        window.addEventListener('fb-error', onErr);
        return () => {
          window.removeEventListener('fb-ready', onReady);
          window.removeEventListener('fb-error', onErr);
        };
      }, []);

      const isTxPaid = (t) => t.isPaid !== false;

      const isCreditCardPurchase = (t) => {
        if (!t || t.category === 'Pagamento de Fatura') return false;
        const pmNorm = normalizeText(t.paymentMethod || '');
        const notesNorm = normalizeText(t.notes || '');
        const idStr = String(t.id || '');
        const baseMerchant = getBaseMerchantName(t.description);
        const isSavedCardMerchant =
          baseMerchant.length >= 4 &&
          recurringMerchants.some(m => m && (baseMerchant === m || baseMerchant.includes(m) || m.includes(baseMerchant)));

        return (
          pmNorm.includes('cartao') ||
          Boolean(t.isProjected) ||
          idStr.startsWith('fatura_proj_') ||
          idStr.startsWith('fatura_rec_') ||
          notesNorm.includes('fatura') ||
          notesNorm.includes('cartao') ||
          isSavedCardMerchant
        );
      };

      const isEligibleForDueAlert = (t) => {
        return !isCreditCardPurchase(t);
      };

      const todayStr = getLocalTodayStr();

      const dueTodayTransactions = useMemo(() => {
        return transactions.filter(
          t => !isTxPaid(t) && t.type === 'expense' && t.date === todayStr && isEligibleForDueAlert(t)
        );
      }, [transactions, todayStr, recurringMerchants]);

      const dueTodayTotal = useMemo(() => {
        return dueTodayTransactions.reduce((acc, t) => acc + t.amount, 0);
      }, [dueTodayTransactions]);

      const pastPendingTransactions = useMemo(() => {
        return transactions
          .filter(t => !isTxPaid(t) && t.date < todayStr && isEligibleForDueAlert(t))
          .sort((a, b) => a.date.localeCompare(b.date));
      }, [transactions, todayStr, recurringMerchants]);

      useEffect(() => {
        if (!user || !transactions.length || fixedCardDatesMigratedRef.current) return;

        let changed = false;
        const updatedList = transactions.map(t => {
          const isProjectedCardRec =
            Boolean(t.isProjected) &&
            (t.recurrenceType === 'fixed' || (t.description || '').includes('[Recorrente]')) &&
            isCreditCardPurchase(t);

          if (!isProjectedCardRec) return t;

          const baseMerchant = getBaseMerchantName(t.description);
          const originTx = transactions
            .filter(other => {
              if (other.id === t.id || other.isProjected) return false;
              if (!isCreditCardPurchase(other)) return false;
              if (t.groupId && other.groupId === t.groupId) return true;
              const otherMerchant = getBaseMerchantName(other.description);
              return (
                baseMerchant.length >= 4 &&
                Math.abs(other.amount - t.amount) < 0.05 &&
                (otherMerchant === baseMerchant || otherMerchant.includes(baseMerchant) || baseMerchant.includes(otherMerchant))
              );
            })
            .sort((a, b) => a.date.localeCompare(b.date))[0];

          if (!originTx || !originTx.date) return t;

          const originDay = parseInt(originTx.date.split('-')[2], 10);
          const [ty, tm, tdStr] = t.date.split('-');
          const currentDay = parseInt(tdStr, 10);

          if (originDay && currentDay !== originDay) {
            const maxDays = new Date(parseInt(ty, 10), parseInt(tm, 10), 0).getDate();
            const clampedDay = String(Math.min(originDay, maxDays)).padStart(2, '0');
            const correctedDate = `${ty}-${tm}-${clampedDay}`;
            if (correctedDate !== t.date) {
              changed = true;
              return { ...t, date: correctedDate };
            }
          }

          return t;
        });

        fixedCardDatesMigratedRef.current = true;
        if (changed) {
          setTransactions(updatedList);
          saveDataToFirestore(updatedList, categories, customRules, recurringMerchants, unpaidInvoiceReminder);
        }
      }, [user, transactions]);

      useEffect(() => {
        if (!user || dueTodayTransactions.length === 0) return;
        const alertSessionKey = `caixaum_due_alert_${user.uid}_${todayStr}`;
        if (sessionStorage.getItem(alertSessionKey)) return;

        sessionStorage.setItem(alertSessionKey, '1');
        setIsDueTodayModalOpen(true);

        if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
          try {
            const names = dueTodayTransactions.map(t => t.description).slice(0, 3).join(', ');
            new Notification('CaixaUm: Contas Vencendo Hoje!', {
              body: `Você tem ${dueTodayTransactions.length} conta(s) prevista(s) hoje (Total: R$ ${dueTodayTotal.toFixed(2)}): ${names}`
            });
          } catch (e) {}
        }
      }, [user, dueTodayTransactions, dueTodayTotal, todayStr]);

      const handleRequestNotificationPermission = async () => {
        if (typeof Notification === 'undefined') {
          alert('Seu navegador não suporta notificações na área de trabalho.');
          return;
        }
        const perm = await Notification.requestPermission();
        setNotifPermission(perm);
        if (perm === 'granted') {
          new Notification('CaixaUm - Alertas Ativados!', {
            body: 'Você será avisado no dia do vencimento das suas contas previstas.'
          });
        }
      };

      const startVoiceRecognition = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Seu navegador não suporta reconhecimento de voz nativo. Recomendamos usar Google Chrome ou Edge.");
          return;
        }

        if (isListening && recognitionRef.current) {
          try { recognitionRef.current.stop(); } catch (e) {}
          setIsListening(false);
          return;
        }

        const recognition = new SpeechRecognition();
        recognitionRef.current = recognition;
        recognition.lang = 'pt-BR';
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => setIsListening(true);
        recognition.onend = () => {
          setIsListening(false);
          recognitionRef.current = null;
        };
        recognition.onerror = (event) => {
          setIsListening(false);
          recognitionRef.current = null;
          if (event.error === 'not-allowed') {
            alert('Permissão do microfone bloqueada. Libere o acesso ao microfone nas configurações do navegador.');
          } else if (event.error === 'no-speech') {
            alert('Nenhuma fala detectada. Toque no microfone e fale próximo ao aparelho.');
          }
        };

        recognition.onresult = (event) => {
          const transcriptRaw = event.results[0][0].transcript;
          const transcriptNorm = normalizeText(transcriptRaw);

          const parsedVal = parseSpokenAmountBR(transcriptRaw);
          const amount = !isNaN(parsedVal) && parsedVal > 0 ? parsedVal : '';

          const type =
            transcriptNorm.includes('receita') ||
            transcriptNorm.includes('ganhei') ||
            transcriptNorm.includes('salario') ||
            transcriptNorm.includes('recebi') ||
            transcriptNorm.includes('reembolso')
              ? 'income'
              : 'expense';

          const isCardSpoken =
            transcriptNorm.includes('cartao') ||
            transcriptNorm.includes('credito');

          const instMatch = transcriptNorm.match(/\b(\d{1,2})\s*(?:vezes|x|parcelas?)\b/);
          let detectedRecurrence = 'single';
          let detectedInstallments = 2;

          if (instMatch && parseInt(instMatch[1], 10) >= 2) {
            detectedRecurrence = 'installment';
            detectedInstallments = Math.min(48, parseInt(instMatch[1], 10));
          } else if (
            transcriptNorm.includes('recorrente') ||
            transcriptNorm.includes('mensal') ||
            transcriptNorm.includes('todo mes') ||
            transcriptNorm.includes('assinatura')
          ) {
            detectedRecurrence = 'fixed';
          }

          let detectedCategory = guessCategory(transcriptRaw, customRules, categories);
          categories.forEach(c => {
            const catFirstWord = normalizeText(c.name).split(' ')[0];
            if (catFirstWord.length >= 4 && transcriptNorm.includes(catFirstWord)) {
              detectedCategory = c.name;
            }
          });

          const cleanDesc = transcriptRaw
            .replace(/R\$\s*\d+(?:[.,]\d+)?/gi, ' ')
            .replace(/\b\d+(?:[.,]\d+)?\b/g, ' ')
            .replace(/\b(?:reais|real|centavos?|mil|milh(?:ão|ões)|cem|cento|duzent[oa]s|trezent[oa]s|quatrocent[oa]s|quinhent[oa]s|seiscent[oa]s|setecent[oa]s|oitocent[oa]s|novecent[oa]s|vinte|trinta|quarenta|cinquenta|sessenta|setenta|oitenta|noventa|dez|onze|doze|treze|catorze|quatorze|quinze|dezesseis|dezessete|dezoito|dezenove|um|uma|dois|duas|três|quatro|cinco|seis|sete|oito|nove)\b/gi, ' ')
            .replace(/\b(?:categoria|despesa|receita|gastei|paguei|recebi|ganhei|comprei|no\s+cartão|de\s+crédito|no\s+crédito|no\s+débito|no\s+pix|parcelado|vezes|parcelas?|recorrente|mensal|com|para|em|no|na|de|do|da|e)\b/gi, ' ')
            .replace(/\s+/g, ' ')
            .trim();

          const finalDesc = cleanDesc
            ? cleanDesc.charAt(0).toUpperCase() + cleanDesc.slice(1)
            : 'Lançamento por Voz';

          const currentToday = getLocalTodayStr();
          const paymentMethod = isCardSpoken ? 'Cartão de Crédito' : 'Débito / PIX';

          setEditingId(null);
          setFormData({
            description: finalDesc,
            amount: amount,
            installmentAmountMode: 'total',
            type: type,
            category: detectedCategory,
            date: currentToday,
            paymentMethod: paymentMethod,
            recurrenceType: detectedRecurrence,
            installmentStartOffset: 0,
            currentInstallment: 1,
            installments: detectedInstallments,
            isPaid: computeDefaultIsPaid(currentToday, detectedRecurrence, 0)
          });
          setIsModalOpen(true);
        };

        try {
          recognition.start();
        } catch (err) {
          setIsListening(false);
        }
      };

      useEffect(() => {
        if (!fbReady || !window.FB) return;
        const { auth, onAuthStateChanged } = window.FB;
        const unsub = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setLoadingAuth(false);
        });
        return () => unsub();
      }, [fbReady]);

      useEffect(() => {
        if (!user || !window.FB) {
          setTransactions([]);
          setCategories(INITIAL_CATEGORIES);
          setCustomRules({});
          setRecurringMerchants([]);
          setUnpaidInvoiceReminder(null);
          fixedCardDatesMigratedRef.current = false;
          return;
        }
        const { db, doc, onSnapshot } = window.FB;
        const userDocRef = doc(db, "fernance_users", user.uid);
        
        const unsub = onSnapshot(userDocRef, (snapshot) => {
          if (snapshot.exists()) {
            const data = snapshot.data();
            if (data.transactions) setTransactions(data.transactions);
            if (data.categories) setCategories(data.categories);
            if (data.customRules) setCustomRules(data.customRules);
            if (data.recurringMerchants) setRecurringMerchants(data.recurringMerchants);
            setUnpaidInvoiceReminder(data.unpaidInvoiceReminder || null);
            if (data.defaultInvoiceDay) setDefaultInvoiceDay(String(data.defaultInvoiceDay));
          } else {
            saveDataToFirestore([], INITIAL_CATEGORIES, {}, [], null, '10');
          }
        });

        return () => unsub();
      }, [user]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const saveDataToFirestore = async (
        newTransactions,
        newCategories,
        newRules = customRules,
        newRecurringMerchants = recurringMerchants,
        newInvoiceReminder = unpaidInvoiceReminder,
        newDefaultInvoiceDay = defaultInvoiceDay
      ) => {
        if (!user || !window.FB) return;
        const { db, doc, setDoc } = window.FB;
        const userDocRef = doc(db, "fernance_users", user.uid);
        setSaveStatus('saving');
        try {
        await setDoc(userDocRef, {
          transactions: newTransactions,
          categories: newCategories,
          customRules: newRules,
          recurringMerchants: newRecurringMerchants,
          unpaidInvoiceReminder: newInvoiceReminder,
          defaultInvoiceDay: newDefaultInvoiceDay,
          updatedAt: new Date().toISOString()
        }, { merge: true });
        setSaveStatus('saved');
        setTimeout(() => setSaveStatus(s => (s === 'saved' ? 'idle' : s)), 2000);
        } catch (err) {
          console.error('Erro ao salvar:', err);
          setSaveStatus('error');
        }
      };

      const monthTransactions = useMemo(() => {
        return transactions.filter(t => t.date && t.date.startsWith(selectedMonth));
      }, [transactions, selectedMonth]);

      const hiddenCardPurchasesCount = useMemo(() => {
        return monthTransactions.filter(t => isCreditCardPurchase(t)).length;
      }, [monthTransactions, recurringMerchants]);

      const filteredMonthTransactions = useMemo(() => {
        return monthTransactions
          .filter(t => {
            const isCardPurchase = isCreditCardPurchase(t);
            if (!showCardPurchases && isCardPurchase && selectedCategoryFilter !== 'CARD_PROJECTED_ONLY') {
              return false;
            }
            if (selectedCategoryFilter === 'ALL') return true;
            if (selectedCategoryFilter === 'PENDING_ONLY') return !isTxPaid(t);
            if (selectedCategoryFilter === 'PAID_ONLY') return isTxPaid(t);
            if (selectedCategoryFilter === 'INSTALLMENTS_ONLY') return t.recurrenceType === 'installment';
            if (selectedCategoryFilter === 'RECURRING_ONLY') return t.recurrenceType === 'fixed' || t.description.includes('[Recorrente]');
            if (selectedCategoryFilter === 'CARD_PROJECTED_ONLY') return Boolean(t.isProjected);
            return t.category === selectedCategoryFilter;
          })
          .sort((a, b) => a.date.localeCompare(b.date));
      }, [monthTransactions, selectedCategoryFilter, showCardPurchases, recurringMerchants]);

      const groupedTransactionsByCategory = useMemo(() => {
        const groupsMap = {};
        filteredMonthTransactions.forEach(t => {
          const catName = t.category || 'Outros / Serviços';
          if (!groupsMap[catName]) {
            const catObj = categories.find(c => c.name === catName);
            groupsMap[catName] = {
              category: catName,
              color: catObj?.color || '#64748B',
              items: [],
              totalExpense: 0,
              totalIncome: 0
            };
          }
          groupsMap[catName].items.push(t);
          if (t.type === 'expense') groupsMap[catName].totalExpense += t.amount;
          else groupsMap[catName].totalIncome += t.amount;
        });
        return Object.values(groupsMap).sort((a, b) => (b.totalExpense + b.totalIncome) - (a.totalExpense + a.totalIncome));
      }, [filteredMonthTransactions, categories]);

      const filteredTotals = useMemo(() => {
        let income = 0;
        let expense = 0;
        filteredMonthTransactions.forEach(t => {
          if (t.type === 'income') income += t.amount;
          else expense += t.amount;
        });
        return {
          income,
          expense,
          net: income - expense,
          count: filteredMonthTransactions.length
        };
      }, [filteredMonthTransactions]);

      const totals = useMemo(() => {
        let realizedIncome = 0;
        let pendingIncome = 0;
        let realizedCashExpense = 0;
        let pendingExpense = 0;
        let consumptionExpense = 0;

        monthTransactions.forEach(t => {
          const paid = isTxPaid(t);
          if (t.type === 'income') {
            if (paid) realizedIncome += t.amount;
            else pendingIncome += t.amount;
          } else {
            if (t.category !== 'Pagamento de Fatura') {
              consumptionExpense += t.amount;
            }
            if (!isCreditCardPurchase(t)) {
              if (paid) realizedCashExpense += t.amount;
              else pendingExpense += t.amount;
            }
          }
        });

        const totalPlannedIncome = realizedIncome + pendingIncome;
        const totalPlannedExpense = realizedCashExpense + pendingExpense;

        return {
          realizedIncome,
          pendingIncome,
          realizedCashExpense,
          pendingExpense,
          consumptionExpense,
          realizedBalance: realizedIncome - realizedCashExpense,
          plannedBalance: totalPlannedIncome - totalPlannedExpense
        };
      }, [monthTransactions, recurringMerchants]);

      const insights = useMemo(() => {
        const [y, m] = selectedMonth.split('-').map(Number);
        const pd = new Date(y, m - 2, 1);
        const prevYM = `${pd.getFullYear()}-${String(pd.getMonth() + 1).padStart(2, '0')}`;
        let prevCons = 0;
        transactions.forEach(t => {
          if (t.date && t.date.startsWith(prevYM) && t.type === 'expense' && t.category !== 'Pagamento de Fatura') prevCons += t.amount;
        });
        const today = getLocalTodayStr();
        const daysInMonth = new Date(y, m, 0).getDate();
        let daysLeft = 0;
        if (today.startsWith(selectedMonth)) daysLeft = daysInMonth - Number(today.slice(8, 10)) + 1;
        else if (selectedMonth > today.slice(0, 7)) daysLeft = daysInMonth;
        const goalCats = categories.filter(c => !c.isIncome && !c.isSystem);
        const budget = goalCats.reduce((a, c) => a + (c.limit || 0), 0);
        const budgetPct = budget > 0 ? (totals.consumptionExpense / budget) * 100 : 0;
        const income = totals.realizedIncome + totals.pendingIncome;
        const savingsRate = income > 0 ? ((income - totals.consumptionExpense) / income) * 100 : null;
        const topGoals = goalCats.filter(c => (c.limit || 0) > 0).map(c => {
          const spent = monthTransactions.filter(t => t.type === 'expense' && t.category === c.name).reduce((a, b) => a + b.amount, 0);
          return { name: c.name, color: c.color, spent, limit: c.limit, pct: (spent / c.limit) * 100 };
        }).sort((a, b) => b.pct - a.pct).slice(0, 4);
        const lim = new Date(); lim.setDate(lim.getDate() + 7);
        const limStr = `${lim.getFullYear()}-${String(lim.getMonth() + 1).padStart(2, '0')}-${String(lim.getDate()).padStart(2, '0')}`;
        const upcoming = transactions.filter(t => t.type === 'expense' && !isTxPaid(t) && !isCreditCardPurchase(t) && t.date >= today && t.date <= limStr)
          .sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5);
        return { prevCons, daysLeft, budget, budgetPct, budgetLeft: budget - totals.consumptionExpense, savingsRate, topGoals, upcoming };
      }, [transactions, categories, totals, monthTransactions, selectedMonth, recurringMerchants]);

      useEffect(() => {
        if (activeTab !== 'dashboard') return;

        if (pieChartInstance.current) pieChartInstance.current.destroy();
        if (pieChartRef.current) {
          const expenseByCat = {};
          monthTransactions
            .filter(t => {
              if (t.type !== 'expense') return false;
              if (pieChartMode === 'cash') {
                return !isCreditCardPurchase(t);
              }
              return t.category !== 'Pagamento de Fatura';
            })
            .forEach(t => {
              expenseByCat[t.category] = (expenseByCat[t.category] || 0) + t.amount;
            });

          const labels = Object.keys(expenseByCat);
          const data = Object.values(expenseByCat);
          const hasData = data.length > 0;
          const totalPieValue = data.reduce((sum, val) => sum + val, 0);
          const bgColors = labels.map(label => {
            const found = categories.find(c => c.name === label);
            return found ? found.color : '#64748B';
          });

          pieChartInstance.current = new Chart(pieChartRef.current, {
            type: 'doughnut',
            data: {
              labels: hasData ? labels : ['Sem Gastos no Mês'],
              datasets: [{
                data: hasData ? data : [1],
                backgroundColor: hasData ? bgColors : ['#E2E8F0'],
                borderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  position: window.innerWidth < 640 ? 'bottom' : 'right',
                  onHover: (event, legendItem, legend) => {
                    const chart = legend.chart;
                    if (!hasData || legendItem.index === undefined) return;
                    if (event?.native?.target) {
                      event.native.target.style.cursor = 'pointer';
                    }
                    chart.setActiveElements([{ datasetIndex: 0, index: legendItem.index }]);
                    chart.tooltip.setActiveElements([{ datasetIndex: 0, index: legendItem.index }], { x: 0, y: 0 });
                    chart.update('none');
                  },
                  onLeave: (event, legendItem, legend) => {
                    const chart = legend.chart;
                    if (event?.native?.target) {
                      event.native.target.style.cursor = 'default';
                    }
                    chart.setActiveElements([]);
                    chart.tooltip.setActiveElements([], { x: 0, y: 0 });
                    chart.update('none');
                  }
                },
                tooltip: {
                  enabled: hasData,
                  callbacks: {
                    label: (context) => {
                      if (!hasData || totalPieValue <= 0) return ' Sem gastos registrados';
                      const value = Number(context.parsed) || 0;
                      const pct = ((value / totalPieValue) * 100).toLocaleString('pt-BR', {
                        minimumFractionDigits: 1,
                        maximumFractionDigits: 1
                      });
                      const formattedVal = value.toLocaleString('pt-BR', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                      });
                      return ` R$ ${formattedVal} (${pct}%)`;
                    }
                  }
                }
              }
            }
          });
        }

        if (barChartInstance.current) barChartInstance.current.destroy();
        if (barChartRef.current) {
          const months = [];
          const incomeData = [];
          const expenseData = [];
          const [selYear, selMonthNum] = selectedMonth.split('-').map(Number);

          for (let i = 11; i >= 0; i--) {
            const d = new Date(selYear, (selMonthNum - 1) - i, 1);
            const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            months.push(d.toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' }));

            const mTxs = transactions.filter(t => t.date && t.date.startsWith(ym));
            incomeData.push(mTxs.filter(t => t.type === 'income').reduce((a, b) => a + b.amount, 0));
            expenseData.push(mTxs.filter(t => t.type === 'expense' && !isCreditCardPurchase(t)).reduce((a, b) => a + b.amount, 0));
          }

          barChartInstance.current = new Chart(barChartRef.current, {
            type: 'bar',
            data: {
              labels: months,
              datasets: [
                { label: 'Receitas', data: incomeData, backgroundColor: '#10B981', borderRadius: 4 },
                { label: 'Despesas (Caixa)', data: expenseData, backgroundColor: '#EF4444', borderRadius: 4 }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: { y: { beginAtZero: true, ticks: { callback: v => 'R$ ' + Number(v).toLocaleString('pt-BR') } } },
              plugins: { tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${brl(c.parsed.y)}` } } }
            }
          });
        }
      }, [activeTab, transactions, selectedMonth, categories, monthTransactions, recurringMerchants, pieChartMode]);

      const translateFirebaseAuthError = (code) => {
        switch (code) {
          case 'auth/invalid-credential':
          case 'auth/wrong-password':
          case 'auth/user-not-found':
            return 'E-mail ou senha incorretos.';
          case 'auth/email-already-in-use':
            return 'Este e-mail já está cadastrado. Clique em "Entrar" para acessar.';
          case 'auth/weak-password':
            return 'A senha deve ter pelo menos 6 caracteres.';
          case 'auth/invalid-email':
            return 'O formato do e-mail informado é inválido.';
          case 'auth/too-many-requests':
            return 'Muitas tentativas seguidas. Aguarde alguns minutos e tente novamente.';
          default:
            return 'Não foi possível concluir a autenticação. Verifique seus dados.';
        }
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthFeedback({ type: '', text: '' });
        if (!window.FB) return;
        const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } = window.FB;

        if (authMode === 'register') {
          if (!displayName.trim()) {
            setAuthFeedback({ type: 'error', text: 'Informe seu nome para identificar seu perfil.' });
            return;
          }
          if (password.length < 6) {
            setAuthFeedback({ type: 'error', text: 'A senha precisa ter no mínimo 6 caracteres.' });
            return;
          }
          if (password !== confirmPassword) {
            setAuthFeedback({ type: 'error', text: 'As senhas não coincidem.' });
            return;
          }
        }

        setSubmittingAuth(true);
        try {
          if (authMode === 'login') {
            await signInWithEmailAndPassword(auth, email.trim(), password);
          } else {
            const cred = await createUserWithEmailAndPassword(auth, email.trim(), password);
            await updateProfile(cred.user, { displayName: displayName.trim() });
            setUser({ ...cred.user, displayName: displayName.trim() });

        const isCard = isCreditCardPurchase(target);

      const handleOpenImportModal = () => {

      const parseRawLinesToItems = (rows, docType) => {
        const parsedItems = [];
        const fallbackDate = docType === 'card_invoice' ? invoiceDueDate : `${selectedMonth}-01`;

        rows.forEach((row, idx) => {
          const dateVal = normalizeDateString(row.date, fallbackDate);
          const descVal = String(row.description || '').trim();
          const numVal = parseBrazilianNumber(row.amount);

          if (!descVal || descVal.length < 2 || isNaN(numVal) || Math.abs(numVal) < 0.01) return;

          const descLower = normalizeText(descVal);
          if (
            descLower.includes('pagamento recebido') ||
            descLower.includes('pagto fatura') ||
            descLower.includes('pagamento de fatura') ||
            descLower.includes('saldo anterior') ||
            descLower.includes('saldo total') ||
            descLower.includes('total da fatura')
          ) {
            return;
          }

          let txType = 'expense';
          if (docType === 'bank_statement') {
            txType = row.explicitType || (numVal > 0 ? 'income' : 'expense');
          } else {
            txType = 'expense';
          }

          const absVal = Math.round(Math.abs(numVal) * 100) / 100;
          const instInfo = docType === 'card_invoice' ? detectInstallmentInfo(descVal) : null;
          const isRecurring = docType === 'card_invoice' && !instInfo && detectRecurringSubscription(descVal, recurringMerchants);
          const suggestedCategory = txType === 'income'
            ? 'Renda / Salário'
            : guessCategory(descVal, customRules, categories);

          parsedItems.push({
            tempId: `prev_${idx}_${nowId()}`,
            selected: true,
            date: dateVal,
            description: descVal,
            amount: absVal,
            type: txType,
            category: suggestedCategory,
            instInfo,
            isInstallment: Boolean(instInfo),
            isRecurring
          });
        });

        return parsedItems;
      };

      const parseCSVText = (text) => {
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
        const rows = [];
        lines.forEach((line, index) => {
          if (index === 0 && (line.toLowerCase().includes('data') || line.toLowerCase().includes('valor') || line.toLowerCase().includes('date'))) return;
          const separator = line.includes(';') ? ';' : ',';
          const parts = line.split(separator).map(p => p.replace(/^"|"$/g, '').trim());
          if (parts.length >= 3) {
            rows.push({ date: parts[0], description: parts[1], amount: parts[parts.length - 1] });
          } else if (parts.length === 2) {
            rows.push({ date: '', description: parts[0], amount: parts[1] });
          }
        });
        return rows;
      };

      const parseOFXText = (text) => {
        const rows = [];
        const blocks = text.split(/<STMTTRN>/i).slice(1);
        blocks.forEach(block => {
          const dtMatch = block.match(/<DTPOSTED>(\d{8})/i);
          const amtMatch = block.match(/<TRNAMT>([-+]?\d+[.,]?\d*)/i);
          const memoMatch = block.match(/<MEMO>([^<\r\n]+)/i);
          const nameMatch = block.match(/<NAME>([^<\r\n]+)/i);
          const typeMatch = block.match(/<TRNTYPE>([^<\r\n]+)/i);

          const rawDesc = (memoMatch?.[1] || nameMatch?.[1] || '').trim();
          const rawAmt = amtMatch ? parseFloat(amtMatch[1].replace(',', '.')) : NaN;
          if (!rawDesc || isNaN(rawAmt)) return;

          const trnType = (typeMatch?.[1] || '').trim().toUpperCase();
          const explicitType = trnType === 'CREDIT' || rawAmt > 0 ? 'income' : 'expense';

          rows.push({
            date: dtMatch ? dtMatch[1] : '',
            description: rawDesc,
            amount: rawAmt,
            explicitType
          });
        });
        return rows;
      };

      const parsePDFTextLines = (fullText) => {
        const rows = [];
        const lines = fullText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        const linePattern = /(\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?)\s+(.+?)\s+([-+]?\s*(?:R\$\s*)?\d{1,3}(?:\.\d{3})*,\d{2}|[-+]?\d+[.,]\d{2})\s*([CD]?)$/i;

        lines.forEach(line => {
          const m = line.match(linePattern);
          if (m) {
            const rawDate = m[1].length <= 5 ? `${m[1]}/${selectedMonth.slice(0, 4)}` : m[1];
            const desc = m[2].trim();
            let amt = parseBrazilianNumber(m[3]);
            const dcFlag = (m[4] || '').toUpperCase();
            if (dcFlag === 'D') amt = -Math.abs(amt);
            if (dcFlag === 'C') amt = Math.abs(amt);
            rows.push({
              date: rawDate,
              description: desc,
              amount: amt,
              explicitType: dcFlag === 'C' || amt > 0 ? 'income' : 'expense'
            });
          }
        });
        return rows;
      };

      const handlePrepareImportPreview = async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;

        setIsParsingFile(true);
        const fileName = file.name;
        const ext = fileName.split('.').pop().toLowerCase();

        try {
          let rawRows = [];

          if (ext === 'ofx' || ext === 'qfx') {
            const text = await file.text();
            rawRows = parseOFXText(text);
          } else if (ext === 'xlsx' || ext === 'xls') {
            if (!window.XLSX) throw new Error('Leitor de Excel não carregado.');
            const buffer = await file.arrayBuffer();
            const workbook = window.XLSX.read(buffer, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonSheet = window.XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
            jsonSheet.forEach((rowArr, idx) => {
              const nonEmpty = rowArr.filter(cell => String(cell).trim() !== '');
              if (nonEmpty.length < 2) return;
              if (idx === 0 && String(nonEmpty[0]).toLowerCase().includes('data')) return;
              if (nonEmpty.length >= 3) {
                rawRows.push({ date: nonEmpty[0], description: nonEmpty[1], amount: nonEmpty[nonEmpty.length - 1] });
              } else {
                rawRows.push({ date: '', description: nonEmpty[0], amount: nonEmpty[1] });
              }
            });
          } else if (ext === 'pdf') {
            if (!window.pdfjsLib) throw new Error('Leitor de PDF não carregado.');
            const buffer = await file.arrayBuffer();
            const pdf = await window.pdfjsLib.getDocument({ data: buffer }).promise;
            let combinedText = '';
            for (let p = 1; p <= pdf.numPages; p++) {
              const page = await pdf.getPage(p);
              const content = await page.getTextContent();
              let lastY = null;
              let lineStr = '';
              content.items.forEach(item => {
                const y = Math.round(item.transform[5]);
                if (lastY !== null && Math.abs(y - lastY) > 4) {
                  combinedText += lineStr.trim() + '\n';
                  lineStr = '';
                }
                lineStr += item.str + ' ';
                lastY = y;
              });
              if (lineStr.trim()) combinedText += lineStr.trim() + '\n';
            }
            rawRows = parsePDFTextLines(combinedText);
          } else {
            const text = await file.text();
            rawRows = parseCSVText(text);
          }

          const previewItems = parseRawLinesToItems(rawRows, importDocType);
          if (previewItems.length === 0) {
            alert('Nenhum lançamento válido foi identificado neste arquivo. Verifique se o layout contém data, descrição e valor.');
          } else {
            setImportPreviewData({
              fileName,
              docType: importDocType,
              items: previewItems
            });
          }
        } catch (err) {
          console.error(err);
          alert(`Não foi possível ler o arquivo (${err.message || 'formato inválido'}).`);
        } finally {
          setIsParsingFile(false);
          if (fileInputRef.current) fileInputRef.current.value = '';
        }
      };

      const handleTogglePreviewItem = (tempId) => {
        setImportPreviewData(prev => {
          if (!prev) return prev;
          return {
            ...prev,
            items: prev.items.map(it => it.tempId === tempId ? { ...it, selected: !it.selected } : it)
          };
        });
