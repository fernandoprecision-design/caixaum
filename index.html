      const handleChangePreviewItemCategory = (tempId, newCat) => {
        setImportPreviewData(prev => {
          if (!prev) return prev;
          return {
            ...prev,
            items: prev.items.map(it => it.tempId === tempId ? { ...it, category: newCat } : it)
          };
        });
      };

      const handleConfirmAndCommitImport = () => {
        if (!importPreviewData) return;
        const selectedItems = importPreviewData.items.filter(it => it.selected);
        if (selectedItems.length === 0) {
          alert('Selecione ao menos um lançamento para importar.');
          return;
        }

        const isCardInvoice = importPreviewData.docType === 'card_invoice';
        const invoiceYearMonth = invoiceDueDate.slice(0, 7);
        const currentToday = getLocalTodayStr();

        let workingTransactions = [...transactions];
        const newItemsToAdd = [];
        let currentPurchasesAmount = 0;

        selectedItems.forEach((item, index) => {
          const absVal = item.amount;
          if (isCardInvoice) currentPurchasesAmount += absVal;

          const baseMerchant = getBaseMerchantName(item.description, item.instInfo?.rawMatch);
          let matchedProjectedIndex = -1;

          if (isCardInvoice) {
            matchedProjectedIndex = workingTransactions.findIndex(t => {
              if (!t.isProjected) return false;
              if (!t.date.startsWith(invoiceYearMonth)) return false;
              if (Math.abs(t.amount - absVal) > 0.05) return false;
              const projInst = detectInstallmentInfo(t.description);
              const projMerchant = getBaseMerchantName(t.description, projInst?.rawMatch);
              if (item.instInfo && projInst) {
                return (
                  item.instInfo.current === projInst.current &&
                  item.instInfo.total === projInst.total &&
                  (projMerchant === baseMerchant || projMerchant.includes(baseMerchant) || baseMerchant.includes(projMerchant))
                );
              }
              return (
                baseMerchant.length >= 4 &&
                (projMerchant === baseMerchant || projMerchant.includes(baseMerchant) || baseMerchant.includes(projMerchant))
              );
            });
          }

          let matchedGroupId = null;

          if (matchedProjectedIndex !== -1) {
            const matchedTx = workingTransactions[matchedProjectedIndex];
            matchedGroupId = matchedTx.groupId || null;
            workingTransactions[matchedProjectedIndex] = {
              ...matchedTx,
              date: item.date,
              description: item.description,
              amount: absVal,
              category: item.category,
              isPaid: true,
              isProjected: false,
              notes: 'Conciliado automaticamente na fatura'
            };
          } else {
            const itemGroupId = isCardInvoice && (item.instInfo || item.isRecurring)
              ? `csv_grp_${nowId()}_${index}`
              : undefined;
            matchedGroupId = itemGroupId || null;

            newItemsToAdd.push({
              id: `imp_${nowId()}_${index}`,
              ...(itemGroupId ? { groupId: itemGroupId } : {}),
              date: item.date,
              description: item.isRecurring && !item.description.includes('[Recorrente]')
                ? `${item.description} [Recorrente]`
                : item.description,
              amount: absVal,
              type: item.type,
              category: item.category,
              paymentMethod: isCardInvoice ? 'Cartão de Crédito' : 'Conta Corrente',
              recurrenceType: item.instInfo ? 'installment' : item.isRecurring ? 'fixed' : 'single',
              installmentCurrent: item.instInfo?.current,
              installmentTotal: item.instInfo?.total,
              isPaid: isCardInvoice ? true : item.date <= currentToday,
              isProjected: false
            });
          }

          if (isCardInvoice && projectFutureOnImport) {
            if (item.instInfo && item.instInfo.current < item.instInfo.total) {
              const remainingCount = item.instInfo.total - item.instInfo.current;
              for (let step = 1; step <= remainingCount; step++) {
                const nextNum = item.instInfo.current + step;
                const nextDateStr = addMonthsPreservingDay(item.date, step);
                const nextMonthPrefix = nextDateStr.slice(0, 7);

                const futureAlreadyExists = [...workingTransactions, ...newItemsToAdd].some(t => {
                  if (t.recurrenceType !== 'installment') return false;
                  const tInst = detectInstallmentInfo(t.description);
                  if (!tInst) return false;
                  const tMerchant = getBaseMerchantName(t.description, tInst.rawMatch);
                  return (
                    tInst.current === nextNum &&
                    tInst.total === item.instInfo.total &&
                    Math.abs(t.amount - absVal) < 0.05 &&
                    (tMerchant === baseMerchant || tMerchant.includes(baseMerchant) || baseMerchant.includes(tMerchant)) &&
                    t.date.startsWith(nextMonthPrefix)
                  );
                });

                if (!futureAlreadyExists) {
                  const nextLabel = `${String(nextNum).padStart(2, '0')}/${String(item.instInfo.total).padStart(2, '0')}`;
                  const projectedDesc = item.description.replace(item.instInfo.rawMatch, `(${nextLabel})`);

                  newItemsToAdd.push({
                    id: `fatura_proj_${nowId()}_${index}_${nextNum}`,
                    groupId: matchedGroupId || `csv_grp_${nowId()}_${index}`,
                    date: nextDateStr,
                    description: projectedDesc,
                    amount: absVal,
                    type: 'expense',
                    category: item.category,
                    paymentMethod: 'Cartão de Crédito',
                    recurrenceType: 'installment',
                    installmentCurrent: nextNum,
                    installmentTotal: item.instInfo.total,
                    isPaid: false,
                    isProjected: true,
                    notes: `Parcela futura projetada (${nextLabel})`
                  });
                }
              }
            } else if (item.isRecurring) {
              for (let step = 1; step <= 11; step++) {
                const nextDateStr = addMonthsPreservingDay(item.date, step);
                const nextMonthPrefix = nextDateStr.slice(0, 7);

                const futureAlreadyExists = [...workingTransactions, ...newItemsToAdd].some(t => {
                  const tMerchant = getBaseMerchantName(t.description);
                  return (
                    t.date.startsWith(nextMonthPrefix) &&
                    Math.abs(t.amount - absVal) < 0.05 &&
                    baseMerchant.length >= 4 &&
                    (tMerchant === baseMerchant || tMerchant.includes(baseMerchant) || baseMerchant.includes(tMerchant))
                  );
                });

                if (!futureAlreadyExists) {
                  newItemsToAdd.push({
                    id: `fatura_rec_${nowId()}_${index}_${step}`,
                    groupId: matchedGroupId || `csv_grp_${nowId()}_${index}`,
                    date: nextDateStr,
                    description: `${item.description} [Recorrente]`,
                    amount: absVal,
                    type: 'expense',
                    category: item.category,
                    paymentMethod: 'Cartão de Crédito',
                    recurrenceType: 'fixed',
                    isPaid: false,
                    isProjected: true,
                    notes: 'Assinatura recorrente projetada na fatura'
                  });
                }
              }
            }
          }
        });

        if (isCardInvoice) {
          const extraPrevVal = parseFloat(previousBalanceAmount) || 0;
          const totalFinalInvoiceToPay = currentPurchasesAmount + extraPrevVal;

          if (extraPrevVal > 0) {
            newItemsToAdd.push({
              id: `prev_balance_${nowId()}`,
              date: invoiceDueDate,
              description: 'Saldo Devedor / Resíduo Fatura Anterior',
              amount: extraPrevVal,
              type: 'expense',
              category: 'Tarifas / Ajustes Fatura',
              paymentMethod: 'Cartão de Crédito',
              isPaid: invoiceDueDate < currentToday,
              notes: 'Incorporado ao total da fatura cobrada no mês atual'
            });
          }

          if (totalFinalInvoiceToPay > 0) {
            newItemsToAdd.push({
              id: `invoice_payment_${nowId()}`,
              date: invoiceDueDate,
              description: `Pagamento Fatura Cartão (${extraPrevVal > 0 ? 'Compras + Saldo Anterior' : 'Compras do Mês'})`,
              amount: Math.round(totalFinalInvoiceToPay * 100) / 100,
              type: 'expense',
              category: 'Pagamento de Fatura',
              paymentMethod: 'Débito Bancário',
              isPaid: invoiceDueDate < currentToday,
              notes: 'Saída de Caixa no Vencimento'
            });
          }
        }

        const finalUpdatedList = [...workingTransactions, ...newItemsToAdd];
        setTransactions(finalUpdatedList);
        if (isCardInvoice) setUnpaidInvoiceReminder(null);
        saveDataToFirestore(finalUpdatedList, categories, customRules, recurringMerchants, isCardInvoice ? null : unpaidInvoiceReminder);
        setIsImportModalOpen(false);
        setImportPreviewData(null);
        setPreviousBalanceAmount('');
      };

      const handleSaveTransaction = (e) => {
        e.preventDefault();
        const baseAmount = Math.round((parseFloat(formData.amount) || 0) * 100) / 100;
        if (isNaN(baseAmount) || baseAmount <= 0) return;

        const baseCleanMerchant = getBaseMerchantName(formData.description);
        const isCard = formData.paymentMethod === 'Cartão de Crédito';
        let updatedTxList = [];
        let updatedRules = { ...customRules };
        let updatedMerchants = [...recurringMerchants];

        if (isCard && formData.recurrenceType === 'fixed' && baseCleanMerchant.length >= 4 && !updatedMerchants.includes(baseCleanMerchant)) {
          updatedMerchants.push(baseCleanMerchant);
          setRecurringMerchants(updatedMerchants);
        }

        if (editingId) {
          const oldTx = transactions.find(t => t.id === editingId);
          let applyRetroactive = false;
          let propagateSeriesChanges = false;

          if (oldTx && oldTx.category !== formData.category) {
            if (baseCleanMerchant.length >= 4) {
              updatedRules[baseCleanMerchant] = formData.category;
              setCustomRules(updatedRules);
            }
            applyRetroactive = confirm(`Deseja aprender que "${formData.description}" pertence a "${formData.category}" e atualizar os outros lançamentos semelhantes?`);
          }

          const wasSingle = !oldTx?.recurrenceType || oldTx.recurrenceType === 'single';
          const becameRecurringOrInst = formData.recurrenceType === 'installment' || formData.recurrenceType === 'fixed';
          const currInst = formData.currentInstallment || 1;
          const totalInst = formData.installments || 2;
          const newGroupId = wasSingle && becameRecurringOrInst ? `grp_conv_${nowId()}` : oldTx?.groupId;

          if (!wasSingle && oldTx?.groupId && (Math.abs(oldTx.amount - baseAmount) >= 0.01 || oldTx.category !== formData.category)) {
            const futureSiblingsCount = transactions.filter(
              t => t.id !== editingId && t.groupId === oldTx.groupId && t.date >= oldTx.date
            ).length;
            if (futureSiblingsCount > 0) {
              propagateSeriesChanges = confirm(
                `Existem ${futureSiblingsCount} lançamentos futuros nesta série.\nDeseja aplicar o novo valor (R$ ${baseAmount.toFixed(2)}) e categoria ("${formData.category}") também para os meses seguintes?`
              );
            }
          }

          const currentLabel = formData.recurrenceType === 'installment'
            ? ` (${String(currInst).padStart(2, '0')}/${String(totalInst).padStart(2, '0')})`
            : '';
          const baseCleanTitle = formData.description.replace(/\s*\(\d{1,2}\/\d{1,2}\)/, '').trim();

          updatedTxList = transactions.map(t => {
            if (t.id === editingId) {
              return {
                ...t,
                groupId: newGroupId || t.groupId,
                description: formData.recurrenceType === 'installment' && !detectInstallmentInfo(t.description)
                  ? `${baseCleanTitle}${currentLabel}`
                  : formData.description,
                amount: baseAmount,
                type: formData.type,
                category: formData.category,
                date: formData.date,
                paymentMethod: formData.paymentMethod,
                recurrenceType: formData.recurrenceType,
                installmentCurrent: formData.recurrenceType === 'installment' ? currInst : undefined,
                installmentTotal: formData.recurrenceType === 'installment' ? totalInst : undefined,
                isPaid: Boolean(formData.isPaid),
                isProjected: formData.isPaid ? false : t.isProjected
              };
            }
            if (propagateSeriesChanges && t.groupId === oldTx.groupId && t.date >= oldTx.date) {
              return {
                ...t,
                amount: baseAmount,
                category: formData.category
              };
            }
            if (applyRetroactive && baseCleanMerchant.length >= 4 && getBaseMerchantName(t.description) === baseCleanMerchant) {
              return { ...t, category: formData.category };
            }
            return t;
          });

          if (wasSingle && becameRecurringOrInst) {
            const generatedFuture = [];
            const anchorDateStr = formData.date;

            if (formData.recurrenceType === 'installment' && totalInst > currInst) {
              for (let nextNum = currInst + 1; nextNum <= totalInst; nextNum++) {
                const step = nextNum - currInst;
                const itemDate = addMonthsPreservingDay(anchorDateStr, step);
                const label = `${String(nextNum).padStart(2, '0')}/${String(totalInst).padStart(2, '0')}`;

                generatedFuture.push({
                  id: `tx_${newGroupId}_p${nextNum}`,
                  groupId: newGroupId,
                  description: `${baseCleanTitle} (${label})`,
                  amount: baseAmount,
                  type: formData.type,
                  category: formData.category,
                  date: itemDate,
                  paymentMethod: formData.paymentMethod,
                  recurrenceType: 'installment',
                  installmentCurrent: nextNum,
                  installmentTotal: totalInst,
                  isPaid: false,
                  isProjected: isCard,
                  notes: isCard ? `Parcela projetada do cartão (${label})` : `Parcela (${label})`
                });
              }
            } else if (formData.recurrenceType === 'fixed') {
              for (let step = 1; step <= 11; step++) {
                const itemDate = addMonthsPreservingDay(anchorDateStr, step);

                generatedFuture.push({
                  id: `tx_${newGroupId}_f${step}`,
                  groupId: newGroupId,
                  description: `${baseCleanTitle} [Recorrente]`,
                  amount: baseAmount,
                  type: formData.type,
                  category: formData.category,
                  date: itemDate,
                  paymentMethod: formData.paymentMethod,
                  recurrenceType: 'fixed',
                  isPaid: false,
                  isProjected: isCard,
                  notes: isCard ? 'Assinatura/recorrência projetada na fatura do cartão' : 'Despesa recorrente'
                });
              }
            }

            updatedTxList = [...updatedTxList, ...generatedFuture];
          }
        } else {
          const newItems = [];
          const groupId = `grp_${nowId()}`;
          const startOffset = parseInt(formData.installmentStartOffset, 10) || 0;

          if (formData.recurrenceType === 'installment' && formData.installments > 1) {
            const perInstallmentVal = formData.installmentAmountMode === 'per_installment'
              ? baseAmount
              : Math.round((baseAmount / formData.installments) * 100) / 100;

            for (let i = 0; i < formData.installments; i++) {
              const itemDate = addMonthsPreservingDay(formData.date, i + startOffset);
              const label = `${String(i + 1).padStart(2, '0')}/${String(formData.installments).padStart(2, '0')}`;
              newItems.push({
                id: `tx_${groupId}_p${i + 1}`,
                groupId: groupId,
                description: `${formData.description} (${label})`,
                amount: perInstallmentVal,
                type: formData.type,
                category: formData.category,
                date: itemDate,
                paymentMethod: formData.paymentMethod,
                recurrenceType: 'installment',
                installmentCurrent: i + 1,
                installmentTotal: formData.installments,
                isPaid: i === 0 && startOffset === 0 ? Boolean(formData.isPaid) : false,
                isProjected: isCard && !(i === 0 && startOffset === 0 && formData.isPaid),
                notes: isCard ? `Parcela projetada do cartão (${label})` : `Parcela (${label})`
              });
            }
          } else if (formData.recurrenceType === 'fixed') {
            for (let i = 0; i < 12; i++) {
              const itemDate = addMonthsPreservingDay(formData.date, i);
              newItems.push({
                id: `tx_${groupId}_f${i + 1}`,
                groupId: groupId,
                description: `${formData.description} [Recorrente]`,
                amount: baseAmount,
                type: formData.type,
                category: formData.category,
                date: itemDate,
                paymentMethod: formData.paymentMethod,
                recurrenceType: 'fixed',
                isPaid: i === 0 ? Boolean(formData.isPaid) : false,
                isProjected: isCard && !(i === 0 && formData.isPaid),
                notes: isCard ? 'Assinatura/recorrência projetada na fatura do cartão' : 'Despesa recorrente'
              });
            }
          } else {
            newItems.push({
              id: `tx_${nowId()}`,
              ...formData,
              amount: baseAmount,
              isPaid: Boolean(formData.isPaid)
            });
          }

          updatedTxList = [...newItems, ...transactions];
        }

        setTransactions(updatedTxList);
        saveDataToFirestore(updatedTxList, categories, updatedRules, updatedMerchants, unpaidInvoiceReminder);
        setIsModalOpen(false);
        setEditingId(null);
      };

      const handleSaveCategory = (e) => {
        e.preventDefault();
        const trimmedName = categoryFormData.name.trim();
        if (!trimmedName) return;

        const duplicate = categories.find(
          c => c.name.toLowerCase() === trimmedName.toLowerCase() && c.id !== editingCategoryId
        );
        if (duplicate) {
          alert('Já existe uma categoria com esse nome.');
          return;
        }

        if (editingCategoryId) {
          const oldCat = categories.find(c => c.id === editingCategoryId);
          const oldName = oldCat ? oldCat.name : '';

          const updatedCategories = categories.map(c => {
            if (c.id === editingCategoryId) {
              return {
                ...c,
                name: trimmedName,
                color: categoryFormData.color,
                limit: parseFloat(categoryFormData.limit) || 1000,
                isIncome: Boolean(categoryFormData.isIncome)
              };
            }
            return c;
          });

          let updatedTxList = transactions;
          let updatedRules = { ...customRules };

          if (oldName && oldName !== trimmedName) {
            updatedTxList = transactions.map(t =>
              t.category === oldName ? { ...t, category: trimmedName } : t
            );
            Object.keys(updatedRules).forEach(key => {
              if (updatedRules[key] === oldName) updatedRules[key] = trimmedName;
            });
            if (selectedCategoryFilter === oldName) {
              setSelectedCategoryFilter(trimmedName);
            }
            if (formData.category === oldName) {
              setFormData(prev => ({ ...prev, category: trimmedName }));
            }
          }

          setCategories(updatedCategories);
          setTransactions(updatedTxList);
          setCustomRules(updatedRules);
          saveDataToFirestore(updatedTxList, updatedCategories, updatedRules, recurringMerchants, unpaidInvoiceReminder);
          setEditingCategoryId(null);
          setCategoryFormData({ name: '', color: '#10B981', limit: 1000, isIncome: false });
        } else {
          const newCat = {
            id: `cat_${nowId()}`,
            name: trimmedName,
            color: categoryFormData.color,
            limit: parseFloat(categoryFormData.limit) || 1000,
            isIncome: Boolean(categoryFormData.isIncome)
          };

          const updatedCategories = [...categories, newCat];
          setCategories(updatedCategories);
          setFormData(prev => ({ ...prev, category: newCat.name }));
          saveDataToFirestore(transactions, updatedCategories, customRules, recurringMerchants, unpaidInvoiceReminder);
          setCategoryFormData({ name: '', color: '#10B981', limit: 1000, isIncome: false });
        }
      };

      const handleEditCategoryClick = (cat) => {
        setEditingCategoryId(cat.id);
        setCategoryFormData({
          name: cat.name,
          color: cat.color || '#10B981',
          limit: cat.limit || 1000,
          isIncome: Boolean(cat.isIncome)
        });
      };

      const handleCancelEditCategory = () => {
        setEditingCategoryId(null);
        setCategoryFormData({ name: '', color: '#10B981', limit: 1000, isIncome: false });
      };

      const handleDeleteCategory = (cat) => {
        if (cat.isSystem || cat.id === 'cat_6') {
          alert('Esta categoria é protegida pelo sistema e não pode ser excluída.');
          return;
        }

        const linkedCount = transactions.filter(t => t.category === cat.name).length;
        const fallbackCat = cat.isIncome ? 'Renda / Salário' : 'Outros / Serviços';

        const confirmMsg = linkedCount > 0
          ? `A categoria "${cat.name}" possui ${linkedCount} lançamento(s) vinculado(s).\nAo excluí-la, esses lançamentos serão movidos para "${fallbackCat}". Deseja continuar?`
          : `Deseja excluir a categoria "${cat.name}"?`;

        if (!confirm(confirmMsg)) return;

        const updatedCategories = categories.filter(c => c.id !== cat.id);
        const updatedTxList = linkedCount > 0
          ? transactions.map(t => t.category === cat.name ? { ...t, category: fallbackCat } : t)
          : transactions;

        const updatedRules = { ...customRules };
        Object.keys(updatedRules).forEach(key => {
          if (updatedRules[key] === cat.name) delete updatedRules[key];
        });

        if (selectedCategoryFilter === cat.name) setSelectedCategoryFilter('ALL');
        if (editingCategoryId === cat.id) handleCancelEditCategory();

        setCategories(updatedCategories);
        setTransactions(updatedTxList);
        setCustomRules(updatedRules);
        saveDataToFirestore(updatedTxList, updatedCategories, updatedRules, recurringMerchants, unpaidInvoiceReminder);
      };

      const handleLimitChange = (catId, newLimit) => {
        const val = parseFloat(newLimit) || 0;
        const updatedCategories = categories.map(c => c.id === catId ? { ...c, limit: val } : c);
        setCategories(updatedCategories);
        saveDataToFirestore(transactions, updatedCategories, customRules, recurringMerchants, unpaidInvoiceReminder);
      };

      const handleEditClick = (t) => {
        const instInfo = detectInstallmentInfo(t.description);
        setEditingId(t.id);
        setFormData({
          description: t.description,
          amount: t.amount,
          installmentAmountMode: 'per_installment',
          type: t.type,
          category: t.category,
          date: t.date,
          paymentMethod: t.paymentMethod || 'Débito / PIX',
          recurrenceType: t.recurrenceType || (instInfo ? 'installment' : 'single'),
          installmentStartOffset: 0,
          currentInstallment: t.installmentCurrent || instInfo?.current || 1,
          installments: t.installmentTotal || instInfo?.total || 2,
          isPaid: isTxPaid(t)
        });
        setIsModalOpen(true);
      };

      const handleDeleteClick = (id) => {
        const targetTx = transactions.find(t => t.id === id);
        if (!targetTx) return;

        const instInfo = detectInstallmentInfo(targetTx.description);
        const isInstallmentOrFixed =
          targetTx.recurrenceType === 'installment' ||
          targetTx.recurrenceType === 'fixed' ||
          Boolean(instInfo) ||
          Boolean(targetTx.groupId);

        if (isInstallmentOrFixed) {
          let relatedGroup = [];
          if (targetTx.groupId) {
            relatedGroup = transactions.filter(t => t.groupId === targetTx.groupId);
          } else {
            const baseTargetMerchant = getBaseMerchantName(targetTx.description, instInfo?.rawMatch);
            relatedGroup = transactions.filter(t => {
              if (t.type !== targetTx.type) return false;
              const tInst = detectInstallmentInfo(t.description);
              const tMerchant = getBaseMerchantName(t.description, tInst?.rawMatch);
              const sameMerchant =
                baseTargetMerchant.length >= 4 &&
                (tMerchant === baseTargetMerchant || tMerchant.includes(baseTargetMerchant) || baseTargetMerchant.includes(tMerchant));
              const sameAmount = Math.abs(t.amount - targetTx.amount) < 0.05;
              const sameRecurrence =
                t.recurrenceType === targetTx.recurrenceType ||
                (instInfo && tInst && instInfo.total === tInst.total);
              return sameMerchant && sameAmount && sameRecurrence;
            });
          }

          if (relatedGroup.length > 1) {
            setDeleteModalData({ targetTx, relatedGroup });
            return;
          }
        }

        if (confirm(`Excluir o lançamento "${targetTx.description}"?`)) {
          const updatedTxList = transactions.filter(t => t.id !== id);
          setTransactions(updatedTxList);
          saveDataToFirestore(updatedTxList, categories, customRules, recurringMerchants, unpaidInvoiceReminder);
        }
      };

      const executeDeleteOption = (mode) => {
        if (!deleteModalData) return;
        const { targetTx, relatedGroup } = deleteModalData;
        let updatedTxList = [];

        if (mode === 'single') {
          updatedTxList = transactions.filter(t => t.id !== targetTx.id);
        } else if (mode === 'all') {
          const idsToRemove = new Set(relatedGroup.map(t => t.id));
          updatedTxList = transactions.filter(t => !idsToRemove.has(t.id));
        } else if (mode === 'from_here') {
          const idsToRemove = new Set(
            relatedGroup
              .filter(t => t.date >= targetTx.date)
              .map(t => t.id)
          );
          updatedTxList = transactions.filter(t => !idsToRemove.has(t.id));
        }

        setTransactions(updatedTxList);
        saveDataToFirestore(updatedTxList, categories, customRules, recurringMerchants, unpaidInvoiceReminder);
        setDeleteModalData(null);
      };

      const renderTransactionRow = (t, hideCategoryColumn = false) => {
        const paid = isTxPaid(t);
        const isDueToday = !paid && t.type === 'expense' && t.date === todayStr && isEligibleForDueAlert(t);
        const isCardProjected = Boolean(t.isProjected);
        const isCreditCard = isCreditCardPurchase(t);
        const isSingle = !t.recurrenceType || t.recurrenceType === 'single';
        const isFixed = t.recurrenceType === 'fixed' || t.description.includes('[Recorrente]');

        return (
          <tr
            key={t.id}
            class={`hover:bg-slate-50 transition ${
              isDueToday
                ? 'bg-rose-50/60'
                : isCardProjected
                  ? 'bg-indigo-50/40'
                  : !paid
                    ? 'bg-amber-50/30'
                    : ''
            }`}
          >
            <td class="py-3 px-4">
              <button
                onClick={() => handleToggleStatus(t.id)}
                class={`px-2.5 py-1 rounded-lg text-xs font-bold flex items-center space-x-1 transition whitespace-nowrap ${
                  paid
                    ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200'
                    : isDueToday
                      ? 'bg-rose-100 text-rose-800 hover:bg-rose-200 border border-rose-300'
                      : isCardProjected
                        ? 'bg-indigo-100 text-indigo-800 hover:bg-indigo-200 border border-indigo-200'
                        : 'bg-amber-100 text-amber-800 hover:bg-amber-200 border border-amber-300'
                }`}
              >
                <span>
                  {paid
                    ? '✅ Efetivado'
                    : isDueToday
                      ? '🔔 Vence Hoje'
                      : isCardProjected
                        ? '💳 Prev. Fatura'
                        : '⏳ Previsto'}
                </span>
              </button>
            </td>
            <td class="py-3 px-4 text-slate-600 font-medium whitespace-nowrap">{formatDateBR(t.date)}</td>
            <td class="py-3 px-4 font-medium">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class={!paid ? 'text-slate-600' : 'text-slate-900'}>{t.description}</span>
                {isCardProjected && (
                  <span class="bg-indigo-100 text-indigo-700 border border-indigo-200 text-[10px] font-bold px-1.5 py-0.5 rounded">
                    💳 Projeção Cartão
                  </span>
                )}
                {!isCardProjected && isCreditCard && (
                  <span class="bg-slate-200/80 text-slate-700 text-[10px] font-bold px-1.5 py-0.5 rounded">
                    💳 Cartão
                  </span>
                )}
                {t.recurrenceType === 'installment' && (
                  <span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-1.5 py-0.5 rounded">
                    Parcelado
                  </span>
                )}
                {isFixed && (
                  <span class="bg-sky-100 text-sky-700 text-[10px] font-bold px-1.5 py-0.5 rounded">
                    🔁 Recorrente
                  </span>
                )}
                {t.category === 'Pagamento de Fatura' && (
                  <span class="bg-indigo-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">
                    Caixa Fatura
                  </span>
                )}
              </div>
            </td>
            {!hideCategoryColumn && (
              <td class="py-3 px-4"><span class="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-md text-xs font-medium">{t.category}</span></td>
            )}
            <td class={`py-3 px-4 text-right font-bold whitespace-nowrap ${t.type === 'expense' ? (paid ? 'text-red-600' : isCardProjected ? 'text-indigo-500' : 'text-red-400') : (paid ? 'text-emerald-600' : 'text-emerald-400')}`}>
              {t.type === 'expense' ? '-' : '+'} {brl(t.amount)}
            </td>
            <td class="py-3 px-4 text-center">
              <div class="flex items-center justify-center space-x-1">
                {!paid && (
                  <button
                    onClick={() => handlePostponeToNextMonth(t.id)}
                    class="px-2 py-1 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-lg text-[11px] font-bold flex items-center space-x-1 transition"
                    title="Não pago neste mês: jogar para o próximo mês"
                  >
                    <span>+1 Mês</span>
                  </button>
                )}
                {isSingle && !isFixed && t.category !== 'Pagamento de Fatura' && (
                  <button
                    onClick={() => handleRequestMakeRecurring(t.id)}
                    class="p-1.5 text-sky-600 hover:bg-sky-50 rounded-lg transition"
                    title="Marcar como Assinatura Recorrente e projetar para os próximos meses"
                  >
                    <i data-lucide="repeat" class="w-4 h-4"></i>
                  </button>
                )}
                {isFixed && t.category !== 'Pagamento de Fatura' && (
                  <button
                    onClick={() => handleRequestUndoRecurring(t.id)}
                    class="px-2 py-1 bg-sky-100 hover:bg-rose-100 text-sky-700 hover:text-rose-700 rounded-lg text-[11px] font-bold flex items-center space-x-1 transition"
                    title="Desfazer Recorrência"
                  >
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                    <span class="hidden xl:inline">Desfazer</span>
                  </button>
                )}
                <button onClick={() => handleEditClick(t)} class="p-1.5 text-slate-500 hover:text-emerald-600" title="Editar"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                <button onClick={() => handleDeleteClick(t.id)} class="p-1.5 text-slate-500 hover:text-red-600" title="Excluir"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
            </td>
          </tr>
        );
      };

      if (loadingAuth) {
        return (
          <div class="min-h-screen flex items-center justify-center bg-slate-50">
            <div class="text-center space-y-3">
              <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
              <p class="text-sm font-semibold text-slate-500">Carregando CaixaUm...</p>
            </div>
          </div>
        );
      }

      if (firebaseError) {
        return (
          <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center space-y-4 shadow-2xl">
              <CaixaUmIcon className="w-14 h-14 mx-auto" />
              <h2 class="text-xl font-bold text-slate-900">Configuração de Ambiente Pendente</h2>
              <p class="text-xs text-slate-600 leading-relaxed">
                Não foi possível obter as chaves em <code>/api/config</code>. Verifique se as variáveis <code>FIREBASE_API_KEY</code> e demais credenciais estão configuradas no painel da Vercel.
              </p>
            </div>
          </div>
        );
      }

      if (!user) {
        return (
          <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
              <div class="text-center space-y-2.5">
                <div class="flex justify-center">
                  <CaixaUmIcon className="w-16 h-16 drop-shadow-md" />
                </div>
                <h2 class="text-3xl font-extrabold tracking-tight text-slate-900">
                  Caixa<span class="text-[#10B981]">Um</span>
                </h2>
                <p class="text-xs text-slate-500 font-medium">Controle Financeiro Individual & Seguro</p>
              </div>

              <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl">
                <button
                  type="button"
                  onClick={() => { setAuthMode('login'); setAuthFeedback({ type: '', text: '' }); }}
                  class={`py-2 text-xs font-bold rounded-lg transition ${authMode === 'login' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                >
                  Entrar
                </button>
                <button
                  type="button"
                  onClick={() => { setAuthMode('register'); setAuthFeedback({ type: '', text: '' }); }}
                  class={`py-2 text-xs font-bold rounded-lg transition ${authMode === 'register' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                >
                  Criar Nova Conta
                </button>
              </div>

              {authFeedback.text && (
                <div class={`text-xs p-3 rounded-xl border font-medium text-center ${
                  authFeedback.type === 'success'
                    ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                    : 'bg-red-50 text-red-600 border-red-200'
                }`}>
                  {authFeedback.text}
                </div>
              )}

              <form onSubmit={handleAuthSubmit} class="space-y-4">
                {authMode === 'register' && (
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Seu Nome</label>
                    <input
                      type="text"
                      required
                      value={displayName}
                      onChange={e => setDisplayName(e.target.value)}
                      placeholder="Ex: Maria Silva"
                      class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none"
                    />
                  </div>
                )}

                <div>
                  <label class="block text-xs font-semibold text-slate-600 mb-1">E-mail</label>
                  <input 
                    type="email" required 
                    value={email} onChange={e => setEmail(e.target.value)} 
                    placeholder="seu.email@exemplo.com" 
                    class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" 
                  />
                </div>

                <div>
                  <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold text-slate-600">Senha</label>
                    {authMode === 'login' && (
                      <button
                        type="button"
                        onClick={() => handleResetPassword(email)}
                        class="text-[11px] text-emerald-600 font-semibold hover:underline"
                      >
                        Esqueci minha senha
                      </button>
                    )}
                  </div>
                  <input 
                    type="password" required 
                    value={password} onChange={e => setPassword(e.target.value)} 
                    placeholder={authMode === 'register' ? 'Mínimo 6 caracteres' : '••••••••'} 
                    class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" 
                  />
                </div>

                {authMode === 'register' && (
                  <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Confirmar Senha</label>
                    <input 
                      type="password" required 
                      value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)} 
                      placeholder="Repita sua senha" 
                      class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" 
                    />
                  </div>
                )}

                <button 
                  type="submit"
                  disabled={submittingAuth}
                  class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-60 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/20 transition text-sm"
                >
                  {submittingAuth
                    ? 'Aguarde...'
                    : authMode === 'login'
                      ? 'Entrar no CaixaUm'
                      : 'Criar Minha Conta Separada'}
                </button>
              </form>

              <p class="text-[11px] text-center text-slate-400">
                Cada usuário possui seu próprio ambiente isolado de lançamentos, metas e categorias.
              </p>
            </div>
          </div>
        );
      }

      const userLabel = user.displayName || user.email?.split('@')[0] || 'Usuário';

      return (
        <div class="min-h-screen flex flex-col">
          {/* Header CaixaUm */}
          <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <CaixaUmIcon className="w-10 h-10 shrink-0 drop-shadow-sm" />
                <div>
                  <div class="flex items-center space-x-2">
                    <h1 class="text-xl font-extrabold tracking-tight text-slate-900 leading-tight">
                      Caixa<span class="text-[#10B981]">Um</span>
                    </h1>
                    <span class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200" title={user.email}>
                      👤 {userLabel}
                    </span>
                  </div>
                  <p class="text-xs text-slate-500 font-medium hidden sm:block">{user.email}</p>
                </div>
              </div>

              {/* Seletor de Mês e Botões de Ação */}
              <div class="flex items-center space-x-2 sm:space-x-3">
                <div class="flex items-center space-x-2 bg-slate-100 px-2.5 sm:px-3 py-1.5 rounded-xl border border-slate-200">
                  <i data-lucide="calendar" class="w-4 h-4 text-slate-500"></i>
                  <input 
                    type="month" 
                    value={selectedMonth}
                    onChange={e => setSelectedMonth(e.target.value)}
                    class="bg-transparent text-xs sm:text-sm font-bold text-slate-700 outline-none cursor-pointer"
                  />
                </div>

                {/* Botão de Sino */}
                <button
                  onClick={() => {
                    if (notifPermission !== 'granted') handleRequestNotificationPermission();
                    if (dueTodayTransactions.length > 0) setIsDueTodayModalOpen(true);
                  }}
                  class={`relative p-2.5 rounded-xl text-xs font-semibold flex items-center justify-center transition ${
                    dueTodayTransactions.length > 0
                      ? 'bg-rose-100 text-rose-700 hover:bg-rose-200'
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                  title={
                    dueTodayTransactions.length > 0
                      ? `${dueTodayTransactions.length} conta(s) vencendo hoje!`
                      : notifPermission === 'granted'
                        ? 'Alertas de vencimento ativos'
                        : 'Clique para ativar notificações de vencimento no dispositivo'
                  }
                >
                  <i data-lucide="bell" class="w-4 h-4"></i>
                  {dueTodayTransactions.length > 0 && (
                    <span class="absolute -top-1 -right-1 w-4 h-4 bg-rose-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center">
                      {dueTodayTransactions.length}
                    </span>
                  )}
                </button>

                <button 
                  onClick={() => {
                    handleCancelEditCategory();
                    setIsCategoriesModalOpen(true);
                  }}
                  class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2.5 sm:px-3 sm:py-2 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition"
                  title="Gerenciar Categorias (Criar, Editar ou Excluir)"
                >
                  <i data-lucide="tags" class="w-4 h-4"></i>
                  <span class="hidden md:inline">Categorias</span>
                </button>

                <button 
                  type="button"
                  onClick={startVoiceRecognition}
                  class={`p-2.5 rounded-xl text-white font-semibold flex items-center justify-center transition shadow-md ${isListening ? 'bg-red-600 animate-pulse' : 'bg-indigo-600 hover:bg-indigo-700'}`}
                  title={isListening ? 'Ouvindo... Toque para parar' : 'Falar Lançamento por Voz'}
                >
                  <i data-lucide="mic" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                </button>

                <button 
                  onClick={() => {
                    setEditingId(null);
                    const currentToday = getLocalTodayStr();
                    setFormData({
                      description: '',
                      amount: '',
                      installmentAmountMode: 'total',
                      type: 'expense',
                      category: 'Outros / Serviços',
                      date: currentToday,
                      paymentMethod: 'Débito / PIX',
                      recurrenceType: 'single',
                      installmentStartOffset: 0,
                      currentInstallment: 1,
                      installments: 2,
                      isPaid: computeDefaultIsPaid(currentToday, 'single', 0)
                    });
                    setIsModalOpen(true);
                  }}
                  class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 sm:px-4 py-2.5 rounded-xl font-semibold text-sm shadow-md shadow-emerald-600/20 flex items-center space-x-2 transition"
                >
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span class="hidden sm:inline">Novo Lançamento</span>
                </button>

                {/* Engrenagem de Configurações do Sistema */}
                <button
                  onClick={() => {
                    setSettingsNameInput(user.displayName || '');
                    setSettingsFeedback({ type: '', text: '' });
                    setDeleteAccountConfirmText('');
                    setDeleteAccountPassword('');
                    setSettingsTab('profile');
                    setIsSettingsModalOpen(true);
                  }}
                  class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 hover:text-slate-900 rounded-xl transition"
                  title="Configurações do Sistema e Conta"
                >
                  <i data-lucide="settings" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                </button>

                <button 
                  onClick={handleLogout}
                  class="p-2.5 text-slate-400 hover:text-red-600 transition"
                  title={`Sair (${user.email})`}
                >
                  <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
              </div>
            </div>
          </header>

          {/* Abas */}
          <div class="bg-white border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-8 overflow-x-auto whitespace-nowrap">
              {[
                { id: 'dashboard', label: 'Dashboard & Gráficos', icon: 'pie-chart' },
                { id: 'transactions', label: `Transações (${filteredMonthTransactions.length})`, icon: 'receipt' },
                { id: 'goals', label: 'Metas & Orçamento', icon: 'target' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  class={`py-4 text-sm font-semibold flex items-center space-x-2 border-b-2 transition ${activeTab === tab.id ? 'border-emerald-600 text-emerald-600' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                >
                  <i data-lucide={tab.icon} class="w-4 h-4"></i>
                  <span>{tab.label}</span>
                </button>
              ))}
            </div>
          </div>

          {saveStatus !== 'idle' && (
            <div class={`fixed bottom-4 right-4 z-50 px-3 py-2 rounded-xl text-xs font-semibold shadow-lg ${saveStatus === 'error' ? 'bg-red-600 text-white' : saveStatus === 'saving' ? 'bg-slate-800 text-white' : 'bg-emerald-600 text-white'}`}>
              {saveStatus === 'saving' ? 'Salvando…' : saveStatus === 'saved' ? 'Salvo ✓' : 'Falha ao salvar — verifique a conexão e tente de novo'}
            </div>
          )}

          {/* Conteúdo */}
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
            {unpaidInvoiceReminder && unpaidInvoiceReminder.amount > 0 && (
              <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-sm">
                <div class="flex items-center space-x-3">
                  <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shrink-0">
                    <i data-lucide="credit-card" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <p class="text-sm font-bold text-indigo-950">
                      Lembrete: Resíduo de R$ {unpaidInvoiceReminder.amount.toLocaleString('pt-BR', { minimumFractionDigits: 2 })} da fatura de {formatMonthBR(unpaidInvoiceReminder.fromMonth)}
                    </p>
                    <p class="text-xs text-indigo-800">
                      Não lançado como despesa extra para evitar duplicidade — virá cobrado automaticamente na próxima fatura do cartão.
                    </p>
                  </div>
                </div>
                <button
                  onClick={() => {
                    if (confirm('Deseja dispensar este lembrete informativo?')) {
                      setUnpaidInvoiceReminder(null);
                      saveDataToFirestore(transactions, categories, customRules, recurringMerchants, null);
                    }
                  }}
                  class="text-xs font-bold text-indigo-700 hover:text-indigo-900 bg-white border border-indigo-200 px-3 py-1.5 rounded-xl shrink-0"
                >
                  Dispensar Aviso
                </button>
              </div>
            )}

            {dueTodayTransactions.length > 0 && (
              <div class="bg-rose-50 border border-rose-300 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-sm">
                <div class="flex items-center space-x-3">
                  <div class="w-10 h-10 rounded-xl bg-rose-600 text-white flex items-center justify-center shrink-0 animate-pulse">
                    <i data-lucide="bell-ring" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <p class="text-sm font-bold text-rose-950">
                      Vencimento Hoje ({formatDateBR(todayStr)}): {dueTodayTransactions.length} {dueTodayTransactions.length === 1 ? 'conta prevista vence hoje' : 'contas previstas vencem hoje'} — Total R$ {dueTodayTotal.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </p>
                    <p class="text-xs text-rose-800 mt-0.5">
                      {dueTodayTransactions.map(t => `${t.description} (R$ ${t.amount.toFixed(2)})`).join(' • ')}
                    </p>
                  </div>
                </div>
                <div class="flex items-center space-x-2 shrink-0">
                  {notifPermission !== 'granted' && (
                    <button
                      onClick={handleRequestNotificationPermission}
                      class="bg-white border border-rose-300 hover:bg-rose-100 text-rose-800 text-xs font-bold px-3 py-2 rounded-xl transition"
                    >
                      Ativar Notificação
                    </button>
                  )}
                  <button
                    onClick={() => setIsDueTodayModalOpen(true)}
                    class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-sm"
                  >
                    Ver & Dar Baixa
                  </button>
                </div>
              </div>
            )}

            {pastPendingTransactions.length > 0 && (
              <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-sm">
                <div class="flex items-center space-x-3">
                  <div class="w-9 h-9 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center shrink-0">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <p class="text-sm font-bold text-amber-900">
                      Você tem {pastPendingTransactions.length} {pastPendingTransactions.length === 1 ? 'lançamento previsto' : 'lançamentos previstos'} com vencimento anterior em aberto
                    </p>
                    <p class="text-xs text-amber-700">
                      Revise para dar baixa, excluir ou jogar para o mês seguinte.
                    </p>
                  </div>
                </div>
                <button
                  onClick={() => setIsOverdueModalOpen(true)}
                  class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition shrink-0"
                >
                  Revisar Pendências
                </button>
              </div>
            )}

            {activeTab === 'dashboard' && (
              <div class="space-y-8">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                  <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Saldo Realizado (Banco)</span>
                      <span class="text-[10px] font-bold bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded">Efetivado</span>
                    </div>
                    <p class={`text-2xl font-bold tabular-nums mt-2 ${totals.realizedBalance >= 0 ? 'text-slate-900' : 'text-red-600'}`}>
                      R$ {totals.realizedBalance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </p>
                    <p class="text-xs text-slate-500 mt-1.5">
                      Previsto final: <strong class={totals.plannedBalance >= 0 ? 'text-slate-700' : 'text-red-600'}>R$ {totals.plannedBalance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</strong>
                    </p>
                  </div>

                  <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Receitas Realizadas</span>
                    <p class="text-2xl font-bold text-emerald-600 mt-2">
                      R$ {totals.realizedIncome.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </p>
                    {totals.pendingIncome > 0 ? (
                      <p class="text-xs text-amber-600 font-medium mt-1.5">+ R$ {totals.pendingIncome.toLocaleString('pt-BR', { minimumFractionDigits: 2 })} a receber</p>
                    ) : (
                      <p class="text-xs text-slate-400 mt-1.5">100% recebido no mês</p>
                    )}
                  </div>

                  <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Saídas Realizadas</span>
                    <p class="text-2xl font-bold text-red-600 mt-2">
                      R$ {totals.realizedCashExpense.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </p>
                    {totals.pendingExpense > 0 ? (
                      <p class="text-xs text-amber-600 font-medium mt-1.5">+ R$ {totals.pendingExpense.toLocaleString('pt-BR', { minimumFractionDigits: 2 })} previstos a pagar</p>
                    ) : (
                      <p class="text-xs text-slate-400 mt-1.5">Nenhuma pendência no mês</p>
                    )}
                  </div>

                  <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Consumo Total (Metas)</span>
                    <p class="text-2xl font-bold text-purple-600 mt-2">
                      R$ {totals.consumptionExpense.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </p>
                    <p class="text-xs text-slate-400 mt-1.5">Competência (Pago + Previsto)</p>
                  </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 class="font-bold text-slate-800 mb-3">Saúde do orçamento</h3>
                    {insights.budget > 0 ? (
                      <div>
                        <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden"><div class={`h-full ${insights.budgetPct >= 100 ? 'bg-red-500' : insights.budgetPct > 75 ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(100, insights.budgetPct)}%` }}></div></div>
                        <p class="text-sm text-slate-600 mt-3 tabular-nums">{brl(totals.consumptionExpense)} de {brl(insights.budget)} ({insights.budgetPct.toFixed(0)}%)</p>
                        <p class={`text-xs mt-1 font-medium ${insights.budgetLeft < 0 ? 'text-red-600' : 'text-emerald-600'}`}>
                          {insights.budgetLeft < 0 ? `Acima do orçamento em ${brl(-insights.budgetLeft)}` : `Ainda cabem ${brl(insights.budgetLeft)}${insights.daysLeft > 0 ? ` (≈ ${brl(insights.budgetLeft / insights.daysLeft)}/dia)` : ''}`}
                        </p>
                      </div>

                          <button
                            type="button"
                            onClick={() => handleEditCategoryClick(cat)}
                            class="p-1.5 text-slate-500 hover:text-emerald-600 rounded-lg hover:bg-slate-100 transition"
                            title="Editar Categoria"
                          >
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                          </button>

                          {!isProtected ? (
                            <button
                              type="button"
                              onClick={() => handleDeleteCategory(cat)}
                              class="p-1.5 text-slate-500 hover:text-red-600 rounded-lg hover:bg-slate-100 transition"
                              title="Excluir Categoria"
                            >
                              <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                          ) : (
                            <span class="p-1.5 text-slate-300 cursor-not-allowed" title="Categoria protegida pelo sistema">
                              <i data-lucide="lock" class="w-4 h-4"></i>
                            </span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div class="pt-3 flex justify-end border-t">
                  <button
                    type="button"
                    onClick={() => {
                      handleCancelEditCategory();
                      setIsCategoriesModalOpen(false);
                    }}
                    class="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition"
                  >
                    Concluir
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: AJUSTAR METAS */}
          {isGoalsModalOpen && (
            <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                  <h3 class="font-bold text-slate-800 text-lg">Ajustar Metas de Gastos</h3>
                  <button onClick={() => setIsGoalsModalOpen(false)}>✕</button>
                </div>
                <div class="space-y-4 max-h-80 overflow-y-auto pr-2 custom-scrollbar">
                  {categories.filter(c => !c.isIncome && !c.isSystem).map(cat => (
                    <div key={cat.id} class="flex items-center justify-between space-x-4 bg-slate-50 p-3 rounded-xl border">
                      <div class="flex items-center space-x-3">
                        <div class="w-3.5 h-3.5 rounded-full" style={{ backgroundColor: cat.color }}></div>
                        <span class="font-medium text-sm text-slate-700">{cat.name}</span>
                      </div>
                      <div class="flex items-center space-x-2">
                        <span class="text-xs text-slate-400">R$</span>
                        <input type="number" step="50" value={cat.limit || ''} onChange={e => handleLimitChange(cat.id, e.target.value)} class="w-28 border rounded-lg p-1.5 text-sm text-right font-bold bg-white" />
                      </div>
                    </div>
                  ))}
                </div>
                <div class="pt-4 flex justify-end border-t">
                  <button onClick={() => setIsGoalsModalOpen(false)} class="px-5 py-2 bg-emerald-600 text-white font-semibold rounded-xl text-sm">Salvar Metas</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
